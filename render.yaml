# Render Blueprint: API Docker + PostgreSQL gerenciado pelo Render.
# Guarde senhas no painel Render (sync: false). Não commite segredos.
databases:
  - name: estoque-ti-postgres
    plan: free
    databaseName: estoque_ti
    user: estoque_ti

services:
  - type: web
    name: sistema-estoque-ti-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: Database__Url
        fromDatabase:
          name: estoque-ti-postgres
          property: connectionString
      - key: FrontendOrigins
        sync: false
      - key: SeedDemoUsers
        value: "true"
      - key: DemoUsers__AdminPassword
        sync: false
      - key: DemoUsers__FuncionarioPassword
        sync: false
      - key: DemoUsers__VendedorPassword
        sync: false
